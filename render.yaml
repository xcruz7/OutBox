services:
  - type: worker
    name: outbox-email-worker
    runtime: node
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build:production
    startCommand: npm run start:worker
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: SMTP_SERVICE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: EMAIL_RATE_LIMIT_MAX
        value: "10"
      - key: EMAIL_RATE_LIMIT_DURATION_MS
        value: "1000"
